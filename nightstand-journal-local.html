<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');

:root {
  --night: #14131C;
  --panel: #1E1D2A;
  --panel2: #282738;
  --line: #33324A;
  --moon: #EDEAF4;
  --dim: #8B8798;
  --faint: #5E5B70;
  --lamp: #E8B04B;
  --lamp-soft: rgba(232, 176, 75, 0.14);
  --danger: #E2725B;
  --serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --mono: 'Space Mono', 'Courier New', monospace;
  --body: 'Outfit', -apple-system, system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--night); }
body { color: var(--moon); font-family: var(--body); }
button { font-family: inherit; cursor: pointer; color: inherit; background: none; border: none; padding: 0; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

.wrap { max-width: 440px; margin: 0 auto; padding: calc(22px + env(safe-area-inset-top)) 20px 120px; }
.view { display: none; }
.view.on { display: block; }

/* ---------- shared ---------- */
.label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; color: var(--dim); margin: 0 0 10px 2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
.rule { height: 1px; background: var(--line); margin-top: 16px; }
.page-title { font-family: var(--serif); font-weight: 400; font-size: 44px; margin: 0; line-height: 1.05; }
.page-sub { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--dim); margin: 6px 0 0; }

@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.blink { animation: blink 1.2s steps(1) infinite; }
.rise { animation: rise 0.45s ease both; }
@media (prefers-reduced-motion: reduce) {
  .blink, .rise { animation: none; }
  * { transition: none !important; }
}

/* ---------- masthead ---------- */
.mast-top { display: flex; justify-content: space-between; align-items: baseline; }
#weekday { font-family: var(--mono); font-size: 12px; letter-spacing: 0.22em; color: var(--dim); }
#streak-badge { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--lamp); display: none; }
#big-date { font-family: var(--serif); font-weight: 400; font-size: 52px; line-height: 1.05; margin: 8px 0 10px; letter-spacing: 0.01em; }
.mast-bottom { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); }
#year { font-size: 12px; letter-spacing: 0.18em; color: var(--faint); }
#clock { font-size: 24px; color: var(--moon); }
#clock .colon { color: var(--lamp); }
#ampm { font-size: 12px; color: var(--dim); margin-left: 6px; letter-spacing: 0.1em; }

/* ---------- ratings ---------- */
.ratings { padding: 6px 16px; }
.rating-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); }
.rating-row:last-child { border-bottom: none; }
.rating-name { font-size: 15px; font-weight: 500; }
.rating-sub { font-size: 12px; color: var(--faint); margin-left: 6px; }
.dots { display: flex; gap: 6px; }
.dot { width: 30px; height: 30px; border-radius: 15px; border: 1.5px solid var(--line); background: transparent; transition: all 0.15s ease; }
.dot.on { border-color: var(--mc); background: var(--mc); box-shadow: 0 0 10px color-mix(in srgb, var(--mc) 30%, transparent); }
.dot.tip { transform: scale(1.12); }

/* ---------- entry ---------- */
.entry-head { display: flex; justify-content: space-between; align-items: baseline; }
#wordcount { font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: 0.1em; }
#entry-text {
  width: 100%; min-height: 180px; resize: none; display: block;
  background-color: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  color: var(--moon); font-family: var(--body); font-size: 15.5px; line-height: 30px;
  padding: 12px 16px 18px; caret-color: var(--lamp);
  background-image: repeating-linear-gradient(transparent 0px, transparent 29px, var(--line) 29px, var(--line) 30px);
  background-attachment: local; background-origin: content-box;
}
#entry-text::placeholder { color: var(--faint); font-style: italic; }

/* ---------- gym ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); transition: all 0.15s ease; }
.chip.on { border-color: var(--lamp); background: var(--lamp-soft); color: var(--lamp); }

/* ---------- autosave strip ---------- */
#autosave-strip { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 10px; border: 1px dashed var(--line); border-radius: 16px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--faint); text-align: center; transition: color 0.25s, border-color 0.25s; }
#as-dot { flex: none; width: 6px; height: 6px; border-radius: 3px; background: var(--faint); transition: background 0.25s, box-shadow 0.25s; }
#autosave-strip.pending { color: var(--lamp); }
#autosave-strip.pending #as-dot { background: var(--lamp); animation: blink 1s steps(1) infinite; }
#autosave-strip.saved { color: var(--dim); }
#autosave-strip.saved #as-dot { background: #4CAF7D; box-shadow: 0 0 8px rgba(76,175,125,0.5); }
#autosave-strip.warn { color: var(--danger); border-color: rgba(226,114,91,0.4); }
#autosave-strip.warn #as-dot { background: var(--danger); }

.section { margin-bottom: 26px; }

/* ---------- past ---------- */
.month-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; color: var(--faint); margin: 0 0 10px 2px; }
.past-card { padding: 14px 16px; margin-bottom: 10px; transition: border-color 0.2s; }
.past-card.open { border-color: var(--faint); }
.past-main { display: block; width: 100%; text-align: left; }
.past-head { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--dim); }
.past-date { color: var(--moon); font-weight: 700; }
.past-today { color: var(--lamp); }
.past-dots { display: flex; gap: 14px; margin-top: 10px; font-family: var(--mono); font-size: 12px; }
.past-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.past-tag { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; color: var(--lamp); border: 1px solid rgba(232,176,75,0.33); border-radius: 999px; padding: 3px 8px; }
.past-text { margin: 10px 0 0; font-size: 14.5px; line-height: 1.55; color: #C9C5D6; white-space: pre-wrap; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.past-card.open .past-text { -webkit-line-clamp: unset; display: block; }
.past-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); text-align: right; }
.del-btn { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--faint); padding: 4px 2px; }
.del-btn.confirm { color: var(--danger); }

.backup-row { display: flex; gap: 10px; margin-top: 8px; }
.backup-btn { flex: 1; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--dim); border: 1px solid var(--line); border-radius: 12px; padding: 12px 0; text-align: center; }
#backup-note { text-align: center; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--faint); margin-top: 10px; min-height: 12px; }

/* ---------- trends ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 8px; text-align: center; }
.tile-value { font-family: var(--serif); font-size: 30px; line-height: 1; }
.tile-value.accent { color: var(--lamp); }
.tile-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em; color: var(--faint); margin-top: 6px; }

.avg-row { margin-bottom: 16px; }
.avg-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
.avg-name { font-size: 14px; font-weight: 500; }
.avg-val { font-family: var(--mono); font-size: 13px; }
.avg-val .of { font-size: 10px; color: var(--faint); }
.bar-track { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; width: 0%; transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1); }
.chart-note { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; color: var(--faint); margin-top: 4px; }

.spark-foot { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; color: var(--faint); margin-top: 6px; }
.spark-foot .now { color: var(--lamp); }

.gym-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.gym-name { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; width: 78px; }
.gym-track { flex: 1; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.gym-fill { height: 100%; border-radius: 3px; background: rgba(232,176,75,0.73); width: 0%; transition: width 0.8s ease; }
.gym-n { font-family: var(--mono); font-size: 11px; width: 20px; text-align: right; }

.empty { text-align: center; padding: 56px 20px; background: var(--panel); border: 1px dashed var(--line); border-radius: 18px; }
.empty-1 { font-family: var(--serif); font-style: italic; font-size: 22px; margin: 0; }
.empty-2 { font-size: 14px; color: var(--dim); margin: 10px 0 22px; }
.empty-cta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--lamp); background: var(--lamp-soft); border: 1px solid rgba(232,176,75,0.4); border-radius: 999px; padding: 10px 18px; }

/* ---------- tab bar ---------- */
nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(20,19,28,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs { max-width: 440px; margin: 0 auto; display: flex; }
.tab { flex: 1; padding: 14px 0 16px; position: relative; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--dim); transition: color 0.2s; }
.tab::before { content: ''; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 2px; background: transparent; transition: background 0.2s; }
.tab.on { color: var(--lamp); }
.tab.on::before { background: var(--lamp); }
</style>
</head>
<body>

<div class="wrap">

  <!-- ================= TODAY ================= -->
  <div class="view on" id="view-today">
    <header class="rise" style="margin-bottom:26px">
      <div class="mast-top">
        <span id="weekday"></span>
        <span id="streak-badge"></span>
      </div>
      <h1 id="big-date"></h1>
      <div class="mast-bottom">
        <span id="year"></span>
        <span id="clock"><span id="clock-h"></span><span class="colon blink">:</span><span id="clock-m"></span><span id="ampm"></span></span>
      </div>
      <div class="rule"></div>
    </header>

    <section class="section rise">
      <div class="label">HOW IT'S GOING</div>
      <div class="card ratings" id="ratings"></div>
    </section>

    <section class="section rise">
      <div class="entry-head">
        <div class="label">TODAY'S ENTRY</div>
        <span id="wordcount"></span>
      </div>
      <textarea id="entry-text" spellcheck="false"></textarea>
    </section>

    <section class="section rise" style="margin-bottom:30px">
      <div class="label">GYM · WHAT GOT TRAINED</div>
      <div class="chips" id="gym-chips"></div>
    </section>

    <div class="rise">
      <div id="autosave-strip"><span id="as-dot"></span><span id="as-text"></span></div>
    </div>
  </div>

  <!-- ================= THE PAST ================= -->
  <div class="view" id="view-past">
    <header class="rise" style="margin-bottom:22px">
      <h1 class="page-title">The Past</h1>
      <p class="page-sub">every day you showed up</p>
      <div class="rule"></div>
    </header>
    <div id="past-list"></div>
    <section style="margin-top:30px">
      <div class="label">YOUR DATA · STAYS ON THIS PHONE</div>
      <div class="backup-row">
        <button class="backup-btn" id="export-btn">EXPORT BACKUP</button>
        <button class="backup-btn" id="import-btn">IMPORT BACKUP</button>
        <input type="file" id="import-file" accept=".json,application/json" style="display:none" />
      </div>
      <p id="backup-note"></p>
    </section>
  </div>

  <!-- ================= TRENDS ================= -->
  <div class="view" id="view-trends">
    <header class="rise" style="margin-bottom:22px">
      <h1 class="page-title">Trends</h1>
      <p class="page-sub">what the checkmarks add up to</p>
      <div class="rule"></div>
    </header>
    <div id="trends-body"></div>
  </div>

</div>

<nav>
  <div class="tabs">
    <button class="tab on" data-view="today">TODAY</button>
    <button class="tab" data-view="past">THE PAST</button>
    <button class="tab" data-view="trends">TRENDS</button>
  </div>
</nav>

<script>
/* ================================================================
   Nightstand — local edition
   All data lives in this browser's localStorage. Nothing is sent
   anywhere. Use Export Backup to keep a copy of your entries.
   ================================================================ */

const KEY = "nightstand-journal-v1";

const METRICS = [
  { key: "happiness",  label: "Happiness",  color: "#E8B04B" },
  { key: "motivation", label: "Motivation", color: "#E2725B" },
  { key: "awareness",  label: "Awareness",  sub: "lucidity", color: "#8E8AF2" },
];
const GYM = ["Chest", "Arms", "Legs", "Back", "Shoulders", "Core", "Cardio"];
const PROMPTS = [
  "What's one thing that went right today?",
  "What's on your mind tonight?",
  "What drained you today, and what gave energy back?",
  "What would make tomorrow 1% better?",
  "Anything you want to remember about today?",
  "What did you notice today that you usually miss?",
];
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- storage (with graceful fallback) ---------- */
let storageOk = true;
let memStore = null;
try {
  const t = "__nightstand_test__";
  localStorage.setItem(t, "1");
  localStorage.removeItem(t);
} catch (e) {
  storageOk = false;
  memStore = {};
}
function loadEntries() {
  try {
    const raw = storageOk ? localStorage.getItem(KEY) : memStore[KEY];
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function persist() {
  const raw = JSON.stringify(entries);
  try {
    if (storageOk) localStorage.setItem(KEY, raw);
    else memStore[KEY] = raw;
  } catch (e) { storageOk = false; }
}

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const pad2 = (n) => String(n).padStart(2, "0");
const dateKey = (d) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const parseKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const words = (t) => (t.trim() ? t.trim().split(/\s+/).length : 0);
function clockParts(d) {
  let h = d.getHours();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return { h: String(h), m: pad2(d.getMinutes()), ampm };
}
function entryAvg(e) {
  const vals = METRICS.map((m) => (e.ratings && e.ratings[m.key]) || 0).filter((v) => v > 0);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}

/* ---------- state ---------- */
let entries = loadEntries();
let ratings = { happiness: 0, motivation: 0, awareness: 0 };
let gym = [];
let expanded = null;
let confirmDel = null;

const todayKey = () => dateKey(new Date());

/* the day this session writes to — lets a late-night entry stay on the day it started */
let entryDay = todayKey();
let autosaveTimer = null;
let settleTimer = null;
let lastInputAt = 0;

function hydrateFor(key) {
  const e = entries[key];
  ratings = e ? Object.assign({ happiness: 0, motivation: 0, awareness: 0 }, e.ratings) : { happiness: 0, motivation: 0, awareness: 0 };
  gym = e ? (e.gym || []).slice() : [];
  $("entry-text").value = e ? (e.text || "") : "";
}
hydrateFor(entryDay);

function streakCount() {
  let count = 0;
  const c = new Date();
  if (!entries[dateKey(c)]) c.setDate(c.getDate() - 1);
  while (entries[dateKey(c)]) { count++; c.setDate(c.getDate() - 1); }
  return count;
}

/* ================================================================
   TODAY view
   ================================================================ */

function buildRatings() {
  const host = $("ratings");
  host.innerHTML = "";
  METRICS.forEach((m) => {
    const row = document.createElement("div");
    row.className = "rating-row";
    const name = document.createElement("div");
    name.innerHTML = '<span class="rating-name">' + m.label + '</span>' + (m.sub ? '<span class="rating-sub">· ' + m.sub + '</span>' : '');
    const dots = document.createElement("div");
    dots.className = "dots";
    for (let v = 1; v <= 5; v++) {
      const b = document.createElement("button");
      b.className = "dot";
      b.style.setProperty("--mc", m.color);
      b.setAttribute("aria-label", m.label + " " + v + " of 5");
      b.addEventListener("click", () => {
        ratings[m.key] = ratings[m.key] === v ? 0 : v;
        paintRatings();
        saveNow();
      });
      dots.appendChild(b);
    }
    row.appendChild(name);
    row.appendChild(dots);
    host.appendChild(row);
  });
  paintRatings();
}

function paintRatings() {
  const rows = $("ratings").children;
  METRICS.forEach((m, i) => {
    const dots = rows[i].querySelectorAll(".dot");
    dots.forEach((d, j) => {
      const v = j + 1;
      d.classList.toggle("on", ratings[m.key] >= v);
      d.classList.toggle("tip", ratings[m.key] === v);
    });
  });
}

function buildGym() {
  const host = $("gym-chips");
  host.innerHTML = "";
  GYM.forEach((g) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = g.toUpperCase();
    b.addEventListener("click", () => {
      const i = gym.indexOf(g);
      if (i >= 0) gym.splice(i, 1); else gym.push(g);
      b.classList.toggle("on", i < 0);
      saveNow();
    });
    if (gym.includes(g)) b.classList.add("on");
    host.appendChild(b);
  });
}

function paintClock() {
  const now = new Date();
  const { h, m, ampm } = clockParts(now);
  $("weekday").textContent = WEEKDAYS[now.getDay()].toUpperCase();
  $("big-date").textContent = MONTHS[now.getMonth()] + " " + now.getDate();
  $("year").textContent = now.getFullYear();
  $("clock-h").textContent = h;
  $("clock-m").textContent = m;
  $("ampm").textContent = ampm;
}

function paintStreak() {
  const s = streakCount();
  const el = $("streak-badge");
  if (s > 0) { el.style.display = "inline"; el.textContent = "◆ " + s + "-DAY STREAK"; }
  else el.style.display = "none";
}

function hasContent() {
  return METRICS.some((m) => ratings[m.key] > 0) || $("entry-text").value.trim().length > 0 || gym.length > 0;
}

function paintAutosave(state) {
  const strip = $("autosave-strip");
  const text = $("as-text");
  strip.className = "";
  if (!storageOk) {
    strip.classList.add("warn");
    text.textContent = "CAN'T SAVE IN THIS PREVIEW — OPEN IN YOUR BROWSER AND IT SAVES ITSELF";
    return;
  }
  if (state === "pending") {
    strip.classList.add("pending");
    text.textContent = "SAVING…";
    return;
  }
  const saved = entries[entryDay];
  if (saved) {
    if (state === "saved") {
      strip.classList.add("saved");
      clearTimeout(settleTimer);
      settleTimer = setTimeout(() => { strip.className = ""; }, 2500);
    }
    text.textContent = "AUTOSAVED · " + saved.timeLabel.toUpperCase();
    return;
  }
  text.textContent = "AUTOSAVE ON · EVERYTHING YOU DO HERE IS KEPT";
}

function paintWordCount() {
  const n = words($("entry-text").value);
  $("wordcount").textContent = n > 0 ? n + " WORDS" : "";
}

function autoGrow() {
  const el = $("entry-text");
  el.style.height = "auto";
  el.style.height = Math.max(180, el.scrollHeight) + "px";
}

function writeEntry() {
  if (!hasContent()) {
    /* everything was cleared — don't keep a ghost blank day */
    if (entries[entryDay]) { delete entries[entryDay]; persist(); paintStreak(); }
    paintAutosave("idle");
    return;
  }
  const d = new Date();
  const { h, m, ampm } = clockParts(d);
  entries[entryDay] = {
    date: entryDay,
    weekday: WEEKDAYS[parseKey(entryDay).getDay()],
    savedAt: d.toISOString(),
    timeLabel: h + ":" + m + " " + ampm,
    ratings: Object.assign({}, ratings),
    text: $("entry-text").value.trim(),
    gym: gym.slice(),
  };
  persist();
  paintStreak();
  paintAutosave("saved");
}

function scheduleAutosave(delay) {
  lastInputAt = Date.now();
  clearTimeout(autosaveTimer);
  paintAutosave("pending");
  autosaveTimer = setTimeout(() => { autosaveTimer = null; writeEntry(); }, delay);
}

function saveNow() {
  lastInputAt = Date.now();
  clearTimeout(autosaveTimer);
  autosaveTimer = null;
  writeEntry();
}

function flushAutosave() {
  if (!autosaveTimer) return;
  clearTimeout(autosaveTimer);
  autosaveTimer = null;
  writeEntry();
}

/* ================================================================
   THE PAST view
   ================================================================ */

function sortedDesc() {
  return Object.values(entries).sort((a, b) => (a.date < b.date ? 1 : -1));
}

function renderPast() {
  const host = $("past-list");
  const list = sortedDesc();
  if (!list.length) {
    host.innerHTML =
      '<div class="empty rise"><p class="empty-1">Nothing here yet.</p>' +
      '<p class="empty-2">Start today\'s page — it saves itself as you go.</p>' +
      '<button class="empty-cta" data-goto="today">WRITE TODAY\'S ENTRY</button></div>';
    return;
  }
  let html = "";
  let curMonth = "";
  const tk = todayKey();
  list.forEach((e) => {
    const d = parseKey(e.date);
    const mLabel = MONTHS[d.getMonth()].toUpperCase() + " " + d.getFullYear();
    if (mLabel !== curMonth) {
      curMonth = mLabel;
      html += '<div class="month-label" style="margin-top:16px">' + mLabel + "</div>";
    }
    const open = expanded === e.date;
    const dots = METRICS.map((m) => {
      const v = (e.ratings && e.ratings[m.key]) || 0;
      return '<span style="color:' + (v ? "var(--moon)" : "var(--faint)") + '">' +
        '<span style="color:' + (v ? m.color : "var(--line)") + ';margin-right:5px">●</span>' + (v || "–") + "</span>";
    }).join("");
    const tags = (e.gym || []).map((g) => '<span class="past-tag">' + esc(g.toUpperCase()) + "</span>").join("");
    html +=
      '<div class="card past-card' + (open ? " open" : "") + '" data-date="' + e.date + '">' +
        '<button class="past-main" data-toggle="' + e.date + '">' +
          '<div class="past-head"><span>' +
            '<span class="past-date">' + MONTHS_SHORT[d.getMonth()].toUpperCase() + " " + pad2(d.getDate()) + "</span>" +
            " · " + (e.weekday || "").slice(0, 3).toUpperCase() + " · " + esc(e.timeLabel || "") +
            (e.date === tk ? '<span class="past-today"> · TODAY</span>' : "") +
          "</span><span style='color:var(--faint)'>" + (open ? "−" : "+") + "</span></div>" +
          '<div class="past-dots">' + dots + "</div>" +
          (tags ? '<div class="past-tags">' + tags + "</div>" : "") +
          (e.text ? '<p class="past-text">' + esc(e.text) + "</p>" : "") +
        "</button>" +
        (open
          ? '<div class="past-foot"><button class="del-btn' + (confirmDel === e.date ? " confirm" : "") + '" data-del="' + e.date + '">' +
            (confirmDel === e.date ? "TAP AGAIN TO DELETE" : "DELETE ENTRY") + "</button></div>"
          : "") +
      "</div>";
  });
  host.innerHTML = html;
}

$("past-list").addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-toggle],[data-del],[data-goto]");
  if (!t) return;
  if (t.dataset.goto) { switchView("today"); return; }
  if (t.dataset.toggle) {
    expanded = expanded === t.dataset.toggle ? null : t.dataset.toggle;
    confirmDel = null;
    renderPast();
    return;
  }
  if (t.dataset.del) {
    const k = t.dataset.del;
    if (confirmDel === k) {
      delete entries[k];
      persist();
      confirmDel = null;
      expanded = null;
      if (k === entryDay) {
        clearTimeout(autosaveTimer);
        autosaveTimer = null;
        ratings = { happiness: 0, motivation: 0, awareness: 0 };
        gym = [];
        $("entry-text").value = "";
        buildGym();
        paintRatings();
        paintWordCount();
        autoGrow();
      }
      paintStreak();
      paintAutosave("idle");
      renderPast();
    } else {
      confirmDel = k;
      renderPast();
    }
  }
});

/* ---------- backup: export / import ---------- */

$("export-btn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nightstand-backup-" + todayKey() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  $("backup-note").textContent = Object.keys(entries).length + " ENTRIES EXPORTED";
});

$("import-btn").addEventListener("click", () => $("import-file").click());

$("import-file").addEventListener("change", (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (typeof data !== "object" || data === null || Array.isArray(data)) throw new Error("bad");
      let n = 0;
      Object.keys(data).forEach((k) => {
        const e = data[k];
        if (e && e.date && /^\d{4}-\d{2}-\d{2}$/.test(e.date)) { entries[e.date] = e; n++; }
      });
      persist();
      $("backup-note").textContent = n + " ENTRIES IMPORTED — MERGED BY DATE";
      expanded = null; confirmDel = null;
      hydrateFor(entryDay);
      buildGym(); paintRatings(); paintWordCount(); autoGrow();
      paintStreak(); paintAutosave("idle"); renderPast();
    } catch (e) {
      $("backup-note").textContent = "COULDN'T READ THAT FILE — EXPECTED A NIGHTSTAND BACKUP (.JSON)";
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
});

/* ================================================================
   TRENDS view
   ================================================================ */

function renderTrends() {
  const host = $("trends-body");
  const list = sortedDesc();
  if (!list.length) {
    host.innerHTML =
      '<div class="empty rise"><p class="empty-1">No data to chart yet.</p>' +
      '<p class="empty-2">Averages appear after your first saved day.</p>' +
      '<button class="empty-cta" data-goto="today">LOG TODAY</button></div>';
    return;
  }

  const totalWords = list.reduce((a, e) => a + words(e.text || ""), 0);
  const s = streakCount();

  const avgs = METRICS.map((m) => {
    const vals = list.map((e) => (e.ratings && e.ratings[m.key]) || 0).filter((v) => v > 0);
    return { m, avg: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0 };
  });

  const spark = list.slice().reverse()
    .map((e) => ({ date: e.date, avg: entryAvg(e) }))
    .filter((p) => p.avg !== null)
    .slice(-14);

  const tally = {};
  GYM.forEach((g) => (tally[g] = 0));
  list.forEach((e) => (e.gym || []).forEach((g) => { if (tally[g] !== undefined) tally[g]++; }));
  const gymRows = GYM.map((g) => ({ g, n: tally[g] })).sort((a, b) => b.n - a.n);
  const maxGym = Math.max(1, ...gymRows.map((x) => x.n));
  const trainedAny = gymRows.some((x) => x.n > 0);

  let html =
    '<div class="tiles rise" style="margin-bottom:24px">' +
      '<div class="tile"><div class="tile-value">' + list.length + '</div><div class="tile-label">ENTRIES</div></div>' +
      '<div class="tile"><div class="tile-value' + (s > 0 ? " accent" : "") + '">' + s + '</div><div class="tile-label">STREAK</div></div>' +
      '<div class="tile"><div class="tile-value">' + totalWords + '</div><div class="tile-label">WORDS</div></div>' +
    "</div>";

  html += '<section class="section rise"><div class="label">AVERAGE PER FEELING · ALL TIME</div><div class="card" style="padding:18px 16px">';
  avgs.forEach(({ m, avg }) => {
    html +=
      '<div class="avg-row"><div class="avg-head">' +
        '<span class="avg-name">' + m.label + "</span>" +
        '<span class="avg-val" style="color:' + (avg ? m.color : "var(--faint)") + '">' + (avg ? avg.toFixed(1) : "–") + '<span class="of"> /5</span></span>' +
      "</div>" +
      '<div class="bar-track"><div class="bar-fill" data-w="' + (avg / 5) * 100 + '" style="background:linear-gradient(90deg,' + m.color + '88,' + m.color + ')"></div></div></div>';
  });
  html += '<div class="chart-note">UNRATED DAYS DON\'T COUNT AGAINST YOU</div></div></section>';

  html += '<section class="section rise"><div class="label">DAILY AVERAGE · LAST ' + spark.length + ' CHECK-INS</div><div class="card" style="padding:18px 16px 12px">';
  if (spark.length >= 2) {
    const W = 360, H = 110, pX = 8, pY = 12, n = spark.length;
    const x = (i) => pX + (i * (W - pX * 2)) / (n - 1);
    const y = (v) => H - pY - ((v - 1) / 4) * (H - pY * 2);
    let svg = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto;display:block">';
    [1, 3, 5].forEach((v) => {
      svg += '<line x1="' + pX + '" x2="' + (W - pX) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 5"/>';
    });
    svg += '<polyline points="' + spark.map((p, i) => x(i) + "," + y(p.avg)).join(" ") + '" fill="none" stroke="var(--lamp)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    spark.forEach((p, i) => {
      const lastPt = i === n - 1;
      svg += '<circle cx="' + x(i) + '" cy="' + y(p.avg) + '" r="' + (lastPt ? 4 : 2.5) + '" fill="' + (lastPt ? "var(--lamp)" : "var(--night)") + '" stroke="var(--lamp)" stroke-width="1.5"/>';
    });
    svg += "</svg>";
    const fmt = (k) => { const d = parseKey(k); return MONTHS_SHORT[d.getMonth()].toUpperCase() + " " + d.getDate(); };
    html += svg + '<div class="spark-foot"><span>' + fmt(spark[0].date) + '</span><span class="now">' + fmt(spark[n - 1].date) + " · " + spark[n - 1].avg.toFixed(1) + "</span></div>";
  } else {
    html += '<p style="font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:0.08em;margin:6px 0">TWO RATED DAYS AND A LINE APPEARS HERE</p>';
  }
  html += "</div></section>";

  html += '<section class="section rise"><div class="label">TRAINING LOG · SESSIONS PER GROUP</div><div class="card" style="padding:16px 16px 8px">';
  if (!trainedAny) {
    html += '<p style="font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:0.08em;margin:4px 0 10px">NO SESSIONS LOGGED YET</p>';
  } else {
    gymRows.forEach(({ g, n }) => {
      html +=
        '<div class="gym-row"><span class="gym-name" style="color:' + (n ? "var(--dim)" : "var(--faint)") + '">' + g.toUpperCase() + "</span>" +
        '<div class="gym-track"><div class="gym-fill" data-w="' + (n / maxGym) * 100 + '"></div></div>' +
        '<span class="gym-n" style="color:' + (n ? "var(--moon)" : "var(--faint)") + '">' + n + "</span></div>";
    });
  }
  html += "</div></section>";

  host.innerHTML = html;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      host.querySelectorAll("[data-w]").forEach((el) => { el.style.width = el.dataset.w + "%"; });
    });
  });
}

$("trends-body").addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-goto]");
  if (t) switchView("today");
});

/* ================================================================
   navigation + boot
   ================================================================ */

function switchView(name) {
  document.querySelectorAll(".view").forEach((v) => v.classList.remove("on"));
  $("view-" + name).classList.add("on");
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.view === name));
  confirmDel = null;
  if (name === "past") renderPast();
  if (name === "trends") renderTrends();
  window.scrollTo(0, 0);
}

document.querySelectorAll(".tab").forEach((t) => {
  t.addEventListener("click", () => switchView(t.dataset.view));
});

$("entry-text").addEventListener("input", () => {
  paintWordCount();
  autoGrow();
  scheduleAutosave(800);
});

/* never lose a half-typed thought: flush the pending save when the app is backgrounded or closed */
document.addEventListener("visibilitychange", () => { if (document.hidden) flushAutosave(); });
window.addEventListener("pagehide", flushAutosave);

/* midnight rollover: a late-night entry keeps writing to the day it started;
   once you've been idle (or the page is fresh), roll over to the new day */
setInterval(() => {
  paintClock();
  const tk = todayKey();
  if (tk !== entryDay) {
    const idle = !autosaveTimer && Date.now() - lastInputAt > 5 * 60 * 1000;
    if (idle || !hasContent()) {
      entryDay = tk;
      hydrateFor(entryDay);
      buildGym();
      paintRatings();
      paintWordCount();
      autoGrow();
      paintStreak();
      paintAutosave("idle");
    }
  }
}, 1000);

/* boot */
$("entry-text").placeholder = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
buildRatings();
buildGym();
paintClock();
paintStreak();
paintWordCount();
autoGrow();
paintAutosave("idle");
</script>
